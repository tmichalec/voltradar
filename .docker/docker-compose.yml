name: voltradar

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: voltradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voltradar
      POSTGRES_USER: voltradar
      POSTGRES_PASSWORD: voltradar_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voltradar -d voltradar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voltradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
