spring:
  application:
    name: voltradar-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:voltradar}
    username: ${DB_USER:voltradar}
    password: ${DB_PASSWORD:voltradar_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: '0'
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  threads:
    virtual:
      enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

integrations:
  zse-drive:
    base-url: ${ZSE_DRIVE_BASE_URL:https://zsedrive.sk}
    connect-timeout: 5s
    read-timeout: 15s
    concurrency-limit: ${ZSE_DRIVE_CONCURRENCY_LIMIT:8}

scheduling:
  zse-refresh:
    cron: ${ZSE_REFRESH_CRON:0 0 3 * * ?}
    enabled: ${ZSE_REFRESH_ENABLED:true}

logging:
  level:
    sk.brutech.voltradar: DEBUG
    org.springframework.web: INFO
